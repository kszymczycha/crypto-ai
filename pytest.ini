; pytest configuration for the repo (rootdir = project directory).
; This lets `pytest` run from the root directory without exporting PYTHONPATH.
[pytest]
testpaths = tests
pythonpath = src
asyncio_mode = auto
addopts = -q --strict-markers
markers =
    integration: tests requiring the OKX sandbox (opt-in, OKX_FLAG=1)
filterwarnings =
    default
